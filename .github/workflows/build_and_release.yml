name: Build & Release Mobile Apps (Android & iOS)

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag Name (e.g. v1.0.0-test)'
        required: false
        default: 'v1.0.0-test'
      release_title:
        description: 'Release Title'
        required: false
        default: 'M-Andhoob Test Release'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android (APK & AAB)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mandhoob_mobile_desktop
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify Flutter & Environment
        run: flutter doctor -v

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Universal Release APK
        run: flutter build apk --release

      - name: Build Split-per-ABI Release APKs
        run: flutter build apk --split-per-abi --release

      - name: Build Android App Bundle (AAB)
        run: flutter build appbundle --release

      - name: Prepare Android Artifacts
        run: |
          mkdir -p ../dist/android
          # Copy universal APK
          if [ -f "build/app/outputs/flutter-apk/app-release.apk" ]; then
            cp build/app/outputs/flutter-apk/app-release.apk ../dist/android/mandhoob-android-universal.apk
          fi
          # Copy split APKs if generated
          if [ -f "build/app/outputs/flutter-apk/app-arm64-v8a-release.apk" ]; then
            cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk ../dist/android/mandhoob-android-arm64-v8a.apk
          fi
          if [ -f "build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk" ]; then
            cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk ../dist/android/mandhoob-android-armeabi-v7a.apk
          fi
          # Copy AAB
          if [ -f "build/app/outputs/bundle/release/app-release.aab" ]; then
            cp build/app/outputs/bundle/release/app-release.aab ../dist/android/mandhoob-android.aab
          fi
          ls -la ../dist/android

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-builds
          path: dist/android/*
          retention-days: 14

  build-ios:
    name: Build iOS (Runner App Archive)
    runs-on: macos-latest
    defaults:
      run:
        working-directory: mandhoob_mobile_desktop
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build iOS App (No Codesign for Testing)
        run: flutter build ios --release --no-codesign

      - name: Package iOS Runner & IPA Archive
        run: |
          mkdir -p ../dist/ios
          APP_PATH=$(find build/ios -name "Runner.app" -type d | head -n 1)
          if [ -n "$APP_PATH" ]; then
            echo "Found Runner.app at $APP_PATH"
            # 1. Package Runner.app ZIP
            PARENT_DIR=$(dirname "$APP_PATH")
            (cd "$PARENT_DIR" && zip -r Runner.zip Runner.app)
            mv "$PARENT_DIR/Runner.zip" ../dist/ios/mandhoob-ios-runner.zip

            # 2. Package .IPA for Sideloading (Sideloadly / AltStore / Test devices)
            PAYLOAD_DIR="/tmp/ipa_packaging"
            rm -rf "$PAYLOAD_DIR"
            mkdir -p "$PAYLOAD_DIR/Payload"
            cp -r "$APP_PATH" "$PAYLOAD_DIR/Payload/"
            (cd "$PAYLOAD_DIR" && zip -r mandhoob-ios-unsigned.ipa Payload)
            mv "$PAYLOAD_DIR/mandhoob-ios-unsigned.ipa" ../dist/ios/mandhoob-ios-unsigned.ipa
          else
            echo "Runner.app not found; packaging entire build/ios directory"
            (cd build && zip -r ../../dist/ios/mandhoob-ios-runner.zip ios)
          fi
          ls -la ../dist/ios

      - name: Upload iOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ios-build
          path: dist/ios/*
          retention-days: 14

  create-release:
    name: Publish Testing Release
    needs: [build-android, build-ios]
    if: always() && !cancelled() && needs.build-android.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Create Release Staging Directory
        run: mkdir -p release-assets

      - name: Download Android Artifacts
        uses: actions/download-artifact@v4
        with:
          name: android-builds
          path: release-assets

      - name: Download iOS Artifacts
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: ios-build
          path: release-assets

      - name: List Release Assets
        run: ls -la release-assets

      - name: Determine Tag and Release Name
        id: release_meta
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG_NAME="${GITHUB_REF#refs/tags/}"
            RELEASE_TITLE="M-Andhoob Release ${TAG_NAME}"
            IS_PRERELEASE=false
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "${{ github.event.inputs.tag_name }}" ]]; then
            TAG_NAME="${{ github.event.inputs.tag_name }}"
            RELEASE_TITLE="${{ github.event.inputs.release_title }}"
            IS_PRERELEASE=true
          else
            TAG_NAME="v1.0.0-test"
            RELEASE_TITLE="M-Andhoob Test Release"
            IS_PRERELEASE=true
          fi
          echo "tag_name=${TAG_NAME}" >> $GITHUB_OUTPUT
          echo "release_title=${RELEASE_TITLE}" >> $GITHUB_OUTPUT
          echo "prerelease=${IS_PRERELEASE}" >> $GITHUB_OUTPUT

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_meta.outputs.tag_name }}
          name: ${{ steps.release_meta.outputs.release_title }}
          prerelease: ${{ steps.release_meta.outputs.prerelease }}
          generate_release_notes: true
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
